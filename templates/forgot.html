{% extends "base.html" %}

{% block title %}Forgot Password | BrightAdel{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card card-shadow">
            <div class="card-body p-4 text-center">

                <div class="display-5 mb-2">🔑</div>
                <h1 class="h4 mb-2">Forgot Password</h1>
                <p class="text-muted mb-4">
                    Enter your phone number and we will send you a reset code via SMS.
                </p>

                <form method="post">
                    <input
                        type="tel"
                        class="form-control mb-3"
                        name="phone"
                        placeholder="e.g. 0244123456"
                        required
                    >
                    <button class="btn btn-primary w-100">Send Reset Code</button>
                </form>

                <p class="mt-3 mb-0">
                    <a href="{{ url_for('login') }}">Back to Login</a>
                </p>

            </div>
        </div>
    </div>
</div>

{% endblock %}
