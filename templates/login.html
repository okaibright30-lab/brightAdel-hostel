{% extends "base.html" %}

{% block title %}
    Login | BrightAdel Hostel
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-5">

        <div class="card card-shadow">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">
                    Login
                </h1>

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">
                            Username or Email
                        </label>

                        <input
                            type="text"
                            class="form-control"
                            name="identifier"
                            required
                        >
                    </div>

                    <div class="mb-3">
                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            class="form-control"
                            name="password"
                            required
                        >
                    </div>

                    <button class="btn btn-primary w-100">
                        Sign In
                    </button>

                </form>

                <p class="mt-3 mb-0">
                    Don't have an account?
                    <a href="{{ url_for('register') }}">
                        Register
                    </a>
                </p>

            </div>
        </div>

    </div>
</div>

{% endblock %}
