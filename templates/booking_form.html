{% extends "base.html" %}

{% block title %}
    Booking Form | BrightAdel Hostel
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-8">

        <div class="card card-shadow">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">
                    {% if booking %}
                        Edit Booking #{{ booking.id }}
                    {% else %}
                        New Booking
                    {% endif %}
                </h1>

                <form method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">
                                Guest
                            </label>

                            <select class="form-select" name="guest_id" required>
                                <option value="">
                                    Select Guest
                                </option>

                                {% for guest in guests %}
                                    <option
                                        value="{{ guest.id }}"
                                        {% if booking and booking.guest_id == guest.id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ guest.full_name }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Room
                            </label>

                            <select class="form-select" name="room_id" required>
                                <option value="">
                                    Select Room
                                </option>

                                {% for room in rooms %}
                                    <option
                                        value="{{ room.id }}"
                                        {% if booking and booking.room_id == room.id %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ room.name }} - ${{ "%.2f"|format(room.price) }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Check In Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="check_in"
                                value="{{ booking.check_in.strftime('%Y-%m-%d') if booking and booking.check_in else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Check Out Date
                            </label>

                            <input
                                type="date"
                                class="form-control"
                                name="check_out"
                                value="{{ booking.check_out.strftime('%Y-%m-%d') if booking and booking.check_out else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select" name="status">
                                {% for status_option in booking_statuses %}
                                    <option
                                        value="{{ status_option }}"
                                        {% if booking and booking.status == status_option %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ status_option.replace('_', ' ').title() }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Notes
                            </label>

                            <textarea
                                class="form-control"
                                name="notes"
                                rows="4"
                            >{{ booking.notes if booking else '' }}</textarea>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary">
                            Save Booking
                        </button>

                        <a href="{{ url_for('bookings') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
