{% extends "base.html" %}

{% block title %}
    Room Form | BrightAdel Hostel
{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">

        <div class="card card-shadow">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">
                    {% if room %}
                        Edit {{ room.name }}
                    {% else %}
                        New Room
                    {% endif %}
                </h1>

                <form method="post">

                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">
                                Room Name
                            </label>

                            <input
                                type="text"
                                class="form-control"
                                name="name"
                                value="{{ room.name if room else '' }}"
                                required
                            >
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">
                                Room Type
                            </label>

                            <select class="form-select" name="room_type">
                                {% for room_type in room_types %}
                                    <option
                                        value="{{ room_type }}"
                                        {% if room and room.room_type == room_type %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ room_type.title() }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">
                                Capacity
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="capacity"
                                min="1"
                                value="{{ room.capacity if room else 1 }}"
                                required
                            >
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">
                                Price Per Night
                            </label>

                            <input
                                type="number"
                                class="form-control"
                                name="price"
                                step="0.01"
                                min="0"
                                value="{{ room.price if room else '0.00' }}"
                                required
                            >
                        </div>

                        <div class="col-md-4">
                            <label class="form-label">
                                Status
                            </label>

                            <select class="form-select" name="status">
                                {% for status_option in room_statuses %}
                                    <option
                                        value="{{ status_option }}"
                                        {% if room and room.status == status_option %}
                                            selected
                                        {% endif %}
                                    >
                                        {{ status_option.title() }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label">
                                Notes
                            </label>

                            <textarea
                                class="form-control"
                                name="notes"
                                rows="4"
                            >{{ room.notes if room else '' }}</textarea>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary">
                            Save Room
                        </button>

                        <a href="{{ url_for('rooms') }}" class="btn btn-outline-secondary">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
