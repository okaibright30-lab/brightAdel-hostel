{% extends "base.html" %}

{% block title %}Room Form | BrightAdel{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-lg-7">
        <div class="card card-shadow">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">
                    {% if room %}Edit {{ room.room_type }}{% else %}Add Rooms{% endif %}
                </h1>

                <form method="post">
                    <div class="row g-3">

                        <div class="col-md-6">
                            <label class="form-label">Hostel</label>
                            <select class="form-select" name="hostel_id" required {% if room %}disabled{% endif %}>
                                <option value="">Select hostel</option>
                                {% for h in hostels %}
                                    <option value="{{ h.id }}" {% if room and room.hostel_id == h.id %}selected{% endif %}>{{ h.name }}</option>
                                {% endfor %}
                            </select>
                            {% if room %}
                                <input type="hidden" name="hostel_id" value="{{ room.hostel_id }}">
                            {% endif %}
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Room Type</label>
                            <select class="form-select" name="room_type" required>
                                <option value="">Select type</option>
                                {% for type in room_types %}
                                    <option value="{{ type }}" {% if room and room.room_type == type %}selected{% endif %}>{{ type }}</option>
                                {% endfor %}
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">How many rooms of this type?</label>
                            <input type="number" min="1" class="form-control" name="quantity" value="{{ room.quantity if room else 1 }}" required>
                            <div class="form-text">3 × "2 in a room" = 6 slots for 6 people.</div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Price per Year (GH₵)</label>
                            <input type="number" step="0.01" min="0" class="form-control" name="price" value="{{ room.price_per_year if room else '' }}" required>
                        </div>

                    </div>

                    <div class="mt-4 d-flex gap-2">
                        <button class="btn btn-primary">Save Rooms</button>
                        <a class="btn btn-outline-secondary" href="{{ url_for('manager_dashboard') }}">Cancel</a>
                    </div>
                </form>

            </div>
        </div>
    </div>
</div>

{% endblock %}
