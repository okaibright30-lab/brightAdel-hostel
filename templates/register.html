{% extends "base.html" %}

{% block title %}Create Account | BrightAdel{% endblock %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card card-shadow">
            <div class="card-body p-4">

                <h1 class="h4 mb-4">Create Account</h1>

                <form method="post">

                    <div class="mb-3">
                        <label class="form-label">I am a...</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="role" id="roleStudent" value="student" checked>
                            <label class="form-check-label" for="roleStudent">
                                Student — I want to book a hostel
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="role" id="roleManager" value="manager">
                            <label class="form-check-label" for="roleManager">
                                Manager — I want to list my hostel
                            </label>
                        </div>
                    </div>

                    <div class="row g-3 mb-3">
                        <div class="col-6">
                            <label class="form-label">First Name</label>
                            <input type="text" class="form-control" name="first_name" required>
                        </div>
                        <div class="col-6">
                            <label class="form-label">Last Name</label>
                            <input type="text" class="form-control" name="last_name" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" class="form-control" name="phone" placeholder="e.g. 0244123456" required>
                        <div class="form-text">A verification code will be sent to this number.</div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>

                    <button class="btn btn-primary w-100">Send Verification Code</button>

                </form>

                <p class="mt-3 mb-0">
                    Already have an account? <a href="{{ url_for('login') }}">Login</a>
                </p>

            </div>
        </div>
    </div>
</div>

{% endblock %}
